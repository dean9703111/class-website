<!DOCTYPE html>
<html lang="zh-Hant-TW">
<!-- 版面樣板。內容請改 content/ 裡的 Markdown。 -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
  :root {
    --board:#1f5c4a; --wood:#c98d4f; --sky:#e8f3f8; --star:#ffd248; --red:#b83a24; --ink:#1e2d3d;
    --muted:#52677a; --line:#c9dde8; --paper:#fff;
    --round:"Huninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--sky); color:var(--ink); font:17px/1.75 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  a { color:var(--board); }
  :focus-visible { outline:3px solid var(--red); outline-offset:2px; }
  h1, h2, h3, nav, .cheer, .days { font-family:var(--round); }
  .wrap, main { max-width:1040px; margin:0 auto; padding-left:16px; padding-right:16px; }

  /* 黑板 */
  header { padding-top:16px; }
  .board { position:relative; background:var(--board); color:#fdfef9; text-align:center; border:10px solid var(--wood); border-radius:14px; padding:20px 12px 28px; box-shadow:inset 0 0 40px rgba(0,0,0,.28); }
  .board h1 { margin:0; font-size:2.1rem; font-weight:400; letter-spacing:.12em; line-height:1.3; }
  .board p { margin:0; }
  .school { font-size:.9rem; color:#cfe5da; }
  .cheer { font-size:1.45rem; line-height:1.7; color:var(--star); margin-top:14px !important; }
  .cheer span { display:inline-block; }
  .star { position:absolute; width:30px; fill:var(--star); }
  .star.a { top:14px; left:16px; transform:rotate(-14deg); }
  .star.b { top:38px; right:18px; width:20px; transform:rotate(18deg); }
  .chalk { position:absolute; bottom:0; right:28px; display:flex; gap:8px; }
  .chalk i { width:34px; height:7px; border-radius:3px; background:#fff; }
  .chalk i:nth-child(2) { background:var(--star); }
  .chalk i:nth-child(3) { background:#f6a5b4; }
  body:not([data-tab="home"]) .cheer { display:none; }
  body:not([data-tab="home"]) .board { padding:8px 12px 14px; }
  body:not([data-tab="home"]) .board h1 { font-size:1.5rem; }
  body:not([data-tab="home"]) .star { display:none; }

  nav { position:sticky; top:0; z-index:2; background:var(--sky); padding:10px 16px; }
  nav div { display:flex; gap:6px; max-width:460px; margin:0 auto; background:var(--paper); border-radius:999px; padding:5px; border:2px solid var(--line); }
  nav a { flex:1; text-align:center; padding:7px 0; border-radius:999px; color:var(--ink); text-decoration:none; font-size:1.1rem; }
  nav a[aria-current] { background:var(--board); color:#fff; }

  section[hidden] { display:none; }
  h2 { font-size:1.5rem; font-weight:400; color:var(--board); margin:18px 0 10px; }
  h3 { font-size:1.25rem; font-weight:400; margin:0; line-height:1.5; }
  ul, ol { margin:8px 0; padding-left:1.3em; }

  /* 首頁 */
  .card { background:var(--paper); border-radius:18px; padding:16px 18px; margin-bottom:14px; }
  .card p { margin:8px 0; }
  .when { color:var(--muted); font-size:.95rem; margin-top:2px !important; }
  .note { color:var(--muted); font-size:.92rem; border-top:2px dashed var(--line); padding-top:8px; }
  .due { list-style:none; padding:0; margin:12px 0; }
  .due li { display:flex; gap:12px; align-items:flex-start; margin-bottom:10px; line-height:1.6; }
  .due b { font-weight:400; flex:none; width:58px; text-align:center; border:2px solid var(--red); border-radius:10px; overflow:hidden; color:var(--red); font:1.15rem/1.5 var(--round); }
  .due b small { display:block; background:var(--red); color:#fff; font-size:.8rem; }
  .events { list-style:none; padding:0; }
  .events li { display:grid; grid-template-columns:minmax(0,9.5em) 1fr; gap:8px; padding:4px 0; }
  .teacher { background:#fff3c4; }
  .sign { text-align:right; font-family:var(--round); }

  /* 課表：手機一次看一天，寬螢幕看整週 */
  .days { display:flex; gap:8px; margin-bottom:12px; }
  .days button { flex:1; font:1.15rem var(--round); padding:8px 0; border:2px solid var(--line); border-radius:12px; background:var(--paper); color:var(--ink); cursor:pointer; }
  .days button[aria-pressed="true"] { background:var(--star); border-color:var(--ink); }
  table { width:100%; table-layout:fixed; border-collapse:separate; border-spacing:4px; background:var(--paper); border-radius:18px; padding:6px; }
  th, td { padding:8px 6px; border-radius:10px; vertical-align:middle; }
  thead th { font:400 1.15rem var(--round); }
  tbody th { width:7.5em; text-align:left; font-size:.95rem; line-height:1.5; }
  thead th:first-child { width:7.5em; }
  th small, td small { display:block; font-size:.8rem; font-weight:400; color:var(--muted); line-height:1.4; }
  td { text-align:center; font:1.15rem/1.5 var(--round); background:#eef1f4; }
  td.國語 { background:#ffdcd3; } td.數學 { background:#d3e6ff; } td.英語 { background:#e8dcfb; }
  td.自然 { background:#d6f0cf; } td.社會 { background:#ffe6bd; } td.體育, td.健康 { background:#c9efea; }
  td.音樂, td.美勞, td.書法 { background:#fbdcee; } td.綜合, td.閱讀 { background:#fff1ad; }
  tr.break th, tr.break td { background:transparent; padding-top:2px; padding-bottom:2px; }
  tr.break td { font-size:.9rem; color:var(--muted); }
  thead { display:none; }
  td:not(.on) { display:none; }

  /* 聯絡簿 */
  .book { display:grid; gap:14px; align-items:start; }
  .page { background:var(--paper); border-radius:6px 18px 18px 6px; border-left:10px solid var(--board); padding:14px 16px 16px; }
  .page ol { margin:6px 0 0; line-height:36px; background:repeating-linear-gradient(transparent 0 35px, var(--line) 35px 36px); }

  footer { text-align:center; color:var(--muted); font-size:.95rem; padding:24px 16px 36px; }

  @media (min-width:760px) {
    .board { padding:34px 24px 46px; }
    .board h1 { font-size:3rem; }
    .cheer { font-size:2rem; }
    .star { width:54px; } .star.a { top:28px; left:40px; } .star.b { top:70px; right:56px; width:36px; }
    .home { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:24px; align-items:start; }
    .days { display:none; }
    thead { display:table-header-group; }
    td:not(.on) { display:table-cell; }
    thead th.today { background:var(--star); }
    .book { grid-template-columns:repeat(3, minmax(0,1fr)); }
  }
</style>
</head>
<body>
<header class="wrap">
  <div class="board">
    <svg class="star a" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5l3.1 6.8 7.4.8-5.5 5 1.5 7.4L12 17.8l-6.5 3.7L7 14.1l-5.5-5 7.4-.8z"/></svg><svg class="star b" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5l3.1 6.8 7.4.8-5.5 5 1.5 7.4L12 17.8l-6.5 3.7L7 14.1l-5.5-5 7.4-.8z"/></svg>
    <h1>{{className}}</h1>
    <p class="school">{{school}}</p>
    <p class="cheer">{{cheer}}</p>
    <div class="chalk" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
</header>
<nav>
  <div>
    <a href="#home">首頁</a>
    <a href="#schedule">課表</a>
    <a href="#book">聯絡簿</a>
  </div>
</nav>

<main>
<section id="home">
{{home}}
</section>

<section id="schedule">
  <h2>課表</h2>
  <div class="days" id="days"></div>
  <table><thead><tr id="heads"><th>節次</th></tr></thead><tbody id="periods">{{periods}}</tbody></table>
  <div class="card" style="margin-top:14px">
{{scheduleNotes}}
  </div>
</section>

<section id="book">
  <h2>聯絡簿</h2>
{{book}}
</section>
</main>

<footer>
  {{footer}}
</footer>

<script>
const $ = id => document.getElementById(id);
const days = ["一","二","三","四","五"];

function showDay(d) {
  [...$("days").children].forEach((b, i) => b.setAttribute("aria-pressed", i === d));
  document.querySelectorAll("[data-d]").forEach(c => c.classList.toggle("on", +c.dataset.d === d));
}

days.forEach((day, i) => {
  const th = document.createElement("th");
  th.textContent = "星期" + day;
  th.dataset.d = i;
  $("heads").append(th);
  const b = document.createElement("button");
  b.textContent = day;
  b.setAttribute("aria-label", "星期" + day);
  b.onclick = () => showDay(i);
  $("days").append(b);
});
// 依裝置日期標示今天；週末整週課表不標示，手機版顯示週一
function showToday() {
  const d = new Date().getDay() - 1;
  document.querySelectorAll("thead th[data-d]").forEach(th => th.classList.toggle("today", +th.dataset.d === d));
  showDay(d >= 0 && d <= 4 ? d : 0);
}
showToday();
// 頁面開著跨日，回到畫面時重新對應
document.addEventListener("visibilitychange", () => { if (!document.hidden) showToday(); });

function showTab() {
  const id = ["schedule", "book"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "home";
  document.body.dataset.tab = id;
  document.querySelectorAll("section").forEach(s => s.hidden = s.id !== id);
  document.querySelectorAll("nav a").forEach(a =>
    a.hash === "#" + id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  scrollTo(0, 0);
}
addEventListener("hashchange", showTab);
showTab();
</script>
</body>
</html>
